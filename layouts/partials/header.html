<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand__logo" aria-hidden="true">🎓</span>
      <span class="brand__text">
        <strong>{{ site.Title }}</strong>
        <small>{{ site.Params.subtitle }}</small>
      </span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="siteNav">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="siteNav" aria-label="主导航">
      <div class="site-search" id="siteSearch">
        <label class="site-search__label" for="siteSearchInput" aria-hidden="true">🔍</label>
        <input class="site-search__input" id="siteSearchInput" type="search" placeholder="搜索证书 / 章节 / 考点…" autocomplete="off" aria-label="站内搜索" role="combobox" aria-expanded="false" aria-controls="siteSearchResults" aria-autocomplete="list">
        <ul class="site-search__results" id="siteSearchResults" role="listbox" hidden></ul>
        <div class="site-search__drop" id="siteSearchDrop" hidden></div>
      </div>
      <a href="{{ site.Home.RelPermalink }}">首页</a>
      <a href="{{ site.Home.RelPermalink }}#certs">全部证书</a>
      <a href="{{ "qiuzhi/" | relURL }}">求职指南</a>
      <a href="{{ "zhichang/" | relURL }}">职场指南</a>
      <a href="{{ "about/" | relURL }}">关于</a>
    </nav>
  </div>
</header>
